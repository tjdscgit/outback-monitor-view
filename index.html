<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outback Monitor</title>
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --muted: #666e7a;
    --line: #dfe3e8; --ok: #1f9d55; --warn: #d97706; --crit: #dc2626;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1c1f25; --ink: #e8eaed; --muted: #9aa3ad;
      --line: #2b2f37; --ok: #34d399; --warn: #fbbf24; --crit: #f87171;
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  @media (max-width: 480px) {
    body { font-size: 14px; }
    .card { padding: 13px; border-radius: 10px; }
    .volts { font-size: 38px; }
    h1 { font-size: 16px; }
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center;
               gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .card-head h2 { margin: 0; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .volts { font-size: 46px; font-weight: 650; line-height: 1; letter-spacing: -.02em; }
  .volts small { font-size: 18px; font-weight: 500; color: var(--muted); }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px;
          font-size: 12px; font-weight: 600; }
  .pill.ok { background: rgba(31,157,85,.15); color: var(--ok); }
  .pill.warn { background: rgba(217,119,6,.15); color: var(--warn); }
  .pill.crit { background: rgba(220,38,38,.15); color: var(--crit); }
  .muted { color: var(--muted); font-size: 13px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .kv span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
  .alert { border-left: 4px solid var(--crit); padding: 10px 14px; margin-bottom: 8px;
           background: rgba(220,38,38,.08); border-radius: 0 8px 8px 0; white-space: pre-line; }
  .banner { border-left: 4px solid var(--warn); padding: 10px 14px; margin-bottom: 8px;
            background: rgba(217,119,6,.08); border-radius: 0 8px 8px 0; }
  pre.codes { white-space: pre-wrap; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
              color: var(--muted); margin: 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 0 20px; }
  a { color: var(--accent); }
  select { background: var(--card); color: var(--ink); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 8px; font-size: 13px; }
  svg { width: 100%; height: auto; display: block; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { cursor: crosshair; touch-action: pan-y; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--card);
               border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
               font-size: 12px; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,.18);
               white-space: nowrap; z-index: 5; display: none; }
  .chart-tip .tip-time { font-weight: 600; color: var(--muted); font-size: 11px;
                          margin-bottom: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Outback Monitor</h1>
    <div class="muted" id="updated">loading&hellip;</div>
  </header>
  <div id="app"><p class="muted">Loading&hellip;</p></div>
  <footer>Read-only snapshot from Google Sheets &middot; refreshes every 60 seconds in
    your browser, the underlying data updates roughly every 60 seconds</footer>
</div>

<script>
"use strict";

// Read-only Apps Script Web App, scoped to this one "key" reading the Live
// status row and History sheet - it cannot write anything back. Visible to
// anyone who views this page's source, same trust model as the old Airtable
// token this replaced. Works from anywhere, not just the home wifi.
var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxF3Z1QVDq7tHW9taW3f62f9K4Q-uULhT3gLKEKrC9-h_ueMh8XPziVQbQXWpOUVWvwiw/exec";
var VIEW_KEY = "IODz-9d7H8swIkoopuwprB0h-rG316yNLp2aeErsPtU";

// Matches config.json's voltage thresholds - update both if either changes.
var THRESHOLDS = {warning: 48.8, critical: 48.0, float: 55.2};

var HOUR_OPTIONS = [
  {hours: 6, label: "6 hours"},
  {hours: 12, label: "12 hours"},
  {hours: 24, label: "24 hours"},
  {hours: 72, label: "3 days"},
  {hours: 168, label: "7 days"}
];

var currentHours = 24;
try {
  var saved = Number(localStorage.getItem("outback_chart_hours"));
  if (HOUR_OPTIONS.some(function (o) { return o.hours === saved; })) currentHours = saved;
} catch (e) { /* private browsing etc - just use the default */ }

var DAY_OPTIONS = [
  {days: 3, label: "3 days"},
  {days: 7, label: "7 days"},
  {days: 30, label: "30 days"},
  {days: 50, label: "50 days"},
  {days: 100, label: "100 days"}
];

var currentDailyDays = 30;
try {
  var savedDays = Number(localStorage.getItem("outback_daily_days"));
  if (DAY_OPTIONS.some(function (o) { return o.days === savedDays; })) currentDailyDays = savedDays;
} catch (e) { /* private browsing etc - just use the default */ }

function esc(text) {
  return String(text === null || text === undefined ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function fmtDuration(seconds) {
  if (seconds === null || seconds === undefined || seconds === "") return "–";
  seconds = Math.round(seconds);
  var h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60);
  if (h) return h + "h " + String(m).padStart(2, "0") + "m";
  if (m) return m + "m " + String(seconds % 60).padStart(2, "0") + "s";
  return seconds + "s";
}

function fmtStamp(iso) {
  if (!iso) return "–";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return esc(iso);
  return d.toLocaleString(undefined, {
    day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
  });
}

function fmtStampSec(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return esc(iso);
  return d.toLocaleString(undefined, {
    day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
}

function statusClass(status) {
  if (status === "critical") return "crit";
  if (status === "warning" || status === "stale") return "warn";
  if (status === "ok") return "ok";
  return "warn";
}

// Wires hover/tap-for-detail onto a chart built by battChart() or
// powerChart(): a vertical guide line, one dot per plotted field, and a
// tooltip showing the timestamp and each field's value at the nearest
// sampled point. Ported from the local dashboard's identical helper.
function bindChartHover(svgId, tipId, chart) {
  var svg = document.getElementById(svgId);
  var tip = document.getElementById(tipId);
  if (!svg || !tip || !chart || chart.series.length < 2) return;

  var series = chart.series, t0 = chart.t0, t1 = chart.t1;
  var padL = chart.padL, padR = chart.padR, padT = chart.padT, padB = chart.padB;
  var W = chart.W, H = chart.H, Y = chart.Y;
  var ns = "http://www.w3.org/2000/svg";

  var guide = document.createElementNS(ns, "line");
  guide.setAttribute("y1", padT); guide.setAttribute("y2", H - padB);
  guide.setAttribute("stroke", "var(--muted)"); guide.setAttribute("stroke-width", "1");
  guide.setAttribute("stroke-dasharray", "3 3"); guide.style.display = "none";
  svg.appendChild(guide);

  var dots = chart.fields.map(function (f) {
    var c = document.createElementNS(ns, "circle");
    c.setAttribute("r", "4"); c.setAttribute("fill", f.color);
    c.setAttribute("stroke", "var(--card)"); c.setAttribute("stroke-width", "1.5");
    c.style.display = "none";
    svg.appendChild(c);
    return c;
  });

  function X(ms) { return padL + (ms - t0) / (t1 - t0) * (W - padL - padR); }

  function nearest(ms) {
    var lo = 0, hi = series.length - 1;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (Date.parse(series[mid][0]) < ms) lo = mid + 1; else hi = mid;
    }
    if (lo > 0 && Math.abs(Date.parse(series[lo - 1][0]) - ms) < Math.abs(Date.parse(series[lo][0]) - ms)) {
      lo -= 1;
    }
    return series[lo];
  }

  function show(clientX, clientY) {
    var rect = svg.getBoundingClientRect();
    var frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    var ms = t0 + (frac * W - padL) / (W - padL - padR) * (t1 - t0);
    var point = nearest(ms);
    if (!point) return;

    var px = X(Date.parse(point[0]));
    guide.setAttribute("x1", px); guide.setAttribute("x2", px); guide.style.display = "";

    var html = '<div class="tip-time">' + fmtStampSec(point[0]) + '</div>';
    chart.fields.forEach(function (f, i) {
      var v = point[f.index];
      dots[i].setAttribute("cx", px);
      dots[i].setAttribute("cy", Y(v === null || v === undefined ? 0 : v));
      dots[i].style.display = "";
      html += '<div><span style="color:' + f.color + '">&#9679;</span> ' + esc(f.label) + ': ' +
              (v === null || v === undefined ? "–" : v.toFixed(f.decimals)) + (f.unit || "") + '</div>';
    });
    tip.innerHTML = html;

    var left = clientX - rect.left + 14;
    if (left + 150 > rect.width) left = clientX - rect.left - 150;
    tip.style.left = Math.max(0, left) + "px";
    tip.style.top = Math.max(0, clientY - rect.top - 12) + "px";
    tip.style.display = "block";
  }

  function hide() {
    guide.style.display = "none";
    dots.forEach(function (d) { d.style.display = "none"; });
    tip.style.display = "none";
  }

  svg.addEventListener("mousemove", function (e) { show(e.clientX, e.clientY); });
  svg.addEventListener("mouseleave", hide);
  svg.addEventListener("touchstart", function (e) {
    show(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: true});
  svg.addEventListener("touchmove", function (e) {
    show(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }, {passive: false});
  svg.addEventListener("touchend", hide);
}

// Battery voltage over the selected window. series is [[iso, volts], ...].
// No generator/grid shading here (unlike the local dashboard) - that history
// doesn't leave the shed PC, only battery volts and kWh counters do.
function battChart(series) {
  if (series.length < 2) return '<p class="muted">Not enough history yet - the chart fills in as the sheet gets more readings.</p>';

  var W = 800, H = 260, padL = 42, padR = 12, padT = 14, padB = 26;
  var t0 = Date.parse(series[0][0]), t1 = Date.parse(series[series.length - 1][0]);
  if (t1 <= t0) t1 = t0 + 1;

  var values = series.map(function (p) { return p[1]; });
  var lo = Math.min.apply(null, values), hi = Math.max.apply(null, values);
  lo = Math.min(lo, THRESHOLDS.warning) - 0.4;
  hi = Math.max(hi, THRESHOLDS.float) + 0.4;
  if (hi - lo < 2) { hi = lo + 2; }

  function X(ms) { return padL + (ms - t0) / (t1 - t0) * (W - padL - padR); }
  function Y(v) { return padT + (hi - v) / (hi - lo) * (H - padT - padB); }

  var parts = [];

  [["critical", THRESHOLDS.critical, "var(--crit)"],
   ["warning", THRESHOLDS.warning, "var(--warn)"],
   ["float " + THRESHOLDS.float.toFixed(1), THRESHOLDS.float, "var(--ok)"]
  ].forEach(function (row) {
    if (row[1] < lo || row[1] > hi) return;
    var y = Y(row[1]).toFixed(1);
    parts.push('<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y +
               '" stroke="' + row[2] + '" stroke-width="1" stroke-dasharray="4 4" opacity=".75"></line>');
    parts.push('<text x="' + (W - padR) + '" y="' + (y - 4) + '" text-anchor="end" font-size="10" fill="' +
               row[2] + '">' + esc(row[0]) + '</text>');
  });

  for (var v = Math.ceil(lo); v <= hi; v++) {
    var y = Y(v).toFixed(1);
    parts.push('<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y +
               '" stroke="var(--line)" stroke-width="1" opacity=".6"></line>');
    parts.push('<text x="' + (padL - 6) + '" y="' + (parseFloat(y) + 3.5) +
               '" text-anchor="end" font-size="10" fill="var(--muted)">' + v + '</text>');
  }

  var spanHours = (t1 - t0) / 3600000;
  var tickStepHours = spanHours > 96 ? 24 : spanHours > 30 ? 6 : 3;
  var tick = new Date(t0);
  tick.setMinutes(0, 0, 0);
  tick.setHours(tick.getHours() + (tickStepHours - tick.getHours() % tickStepHours));
  for (; tick.getTime() < t1; tick.setHours(tick.getHours() + tickStepHours)) {
    var x = X(tick.getTime()).toFixed(1);
    var label = tickStepHours === 24
      ? (tick.getMonth() + 1) + "/" + tick.getDate()
      : String(tick.getHours()).padStart(2, "0") + ":00";
    parts.push('<text x="' + x + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' +
               label + '</text>');
  }

  var d = series.map(function (p, i) {
    return (i ? "L" : "M") + X(Date.parse(p[0])).toFixed(1) + " " + Y(p[1]).toFixed(1);
  }).join(" ");
  parts.push('<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" ' +
             'stroke-linejoin="round" stroke-linecap="round"></path>');

  var last = series[series.length - 1];
  parts.push('<circle cx="' + X(Date.parse(last[0])).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) +
             '" r="3.5" fill="var(--accent)"></circle>');

  window.__voltChart = {series: series, t0: t0, t1: t1, padL: padL, padR: padR,
                        padT: padT, padB: padB, W: W, H: H, Y: Y,
                        fields: [{index: 1, label: "battery", color: "var(--accent)",
                                 decimals: 1, unit: " V"}]};

  return '<div class="chart-wrap"><svg id="voltChart" viewBox="0 0 ' + W + ' ' + H +
         '" role="img" aria-label="Battery voltage over time">' +
         parts.join("") + '</svg><div id="voltTip" class="chart-tip"></div></div>' +
         '<p class="muted">' + values.length + ' samples (low ' + Math.min.apply(null, values).toFixed(1) +
         ' V, high ' + Math.max.apply(null, values).toFixed(1) + ' V).</p>';
}

// Power usage (kWh-so-today counters, summed across both FX units) over the
// selected window. series is [[iso, charge_kwh, inverter_kwh], ...]. These
// reset to ~0 at local midnight, so a window spanning more than a day shows
// a sawtooth - one climb per day - rather than a single running total.
function powerChart(series) {
  if (series.length < 2) return '<p class="muted">Not enough history yet - the chart fills in as the sheet gets more readings.</p>';

  var W = 800, H = 220, padL = 42, padR = 12, padT = 14, padB = 26;
  var t0 = Date.parse(series[0][0]), t1 = Date.parse(series[series.length - 1][0]);
  if (t1 <= t0) t1 = t0 + 1;

  var lines = [["charge", 1, "var(--ok)"], ["inverter", 2, "var(--accent)"]];
  var movingValues = [];
  lines.forEach(function (l) {
    var vals = series.map(function (p) { return p[l[1]]; });
    var lMin = Math.min.apply(null, vals), lMax = Math.max.apply(null, vals);
    if (lMax - lMin > 0.001) movingValues = movingValues.concat(vals);
  });
  var allValues = series.map(function (p) { return lines.map(function (l) { return p[l[1]]; }); })
                        .reduce(function (a, b) { return a.concat(b); }, []);
  var scaleValues = movingValues.length ? movingValues : allValues;
  var lo = Math.min.apply(null, scaleValues);
  var hi = Math.max.apply(null, scaleValues);
  var pad = Math.max((hi - lo) * 0.15, 0.05);
  lo -= pad;
  hi += pad;

  function X(ms) { return padL + (ms - t0) / (t1 - t0) * (W - padL - padR); }
  function Y(v) {
    var y = padT + (hi - v) / (hi - lo) * (H - padT - padB);
    return Math.max(padT, Math.min(H - padB, y));
  }

  var parts = [];

  var rawStep = (hi - lo) / 4;
  var mag = Math.pow(10, Math.floor(Math.log(rawStep) / Math.LN10));
  var norm = rawStep / mag;
  var step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  var decimals = Math.max(0, -Math.floor(Math.log(step) / Math.LN10 + 1e-9));
  for (var v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    var y = Y(v).toFixed(1);
    parts.push('<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y +
               '" stroke="var(--line)" stroke-width="1" opacity=".6"></line>');
    parts.push('<text x="' + (padL - 6) + '" y="' + (parseFloat(y) + 3.5) +
               '" text-anchor="end" font-size="10" fill="var(--muted)">' + v.toFixed(decimals) + '</text>');
  }

  var spanHours = (t1 - t0) / 3600000;
  var tickStepHours = spanHours > 96 ? 24 : spanHours > 30 ? 6 : 3;
  var tick = new Date(t0);
  tick.setMinutes(0, 0, 0);
  tick.setHours(tick.getHours() + (tickStepHours - tick.getHours() % tickStepHours));
  for (; tick.getTime() < t1; tick.setHours(tick.getHours() + tickStepHours)) {
    var x = X(tick.getTime()).toFixed(1);
    var label = tickStepHours === 24
      ? (tick.getMonth() + 1) + "/" + tick.getDate()
      : String(tick.getHours()).padStart(2, "0") + ":00";
    parts.push('<text x="' + x + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' +
               label + '</text>');
  }

  lines.forEach(function (l) {
    var d = series.map(function (p, i) {
      return (i ? "L" : "M") + X(Date.parse(p[0])).toFixed(1) + " " + Y(p[l[1]]).toFixed(1);
    }).join(" ");
    parts.push('<path d="' + d + '" fill="none" stroke="' + l[2] + '" stroke-width="2" ' +
               'stroke-linejoin="round" stroke-linecap="round"></path>');
  });

  var legend = lines.map(function (l) {
    return '<span style="color:' + l[2] + '">&#9679;</span> ' + l[0];
  }).join('&nbsp;&nbsp;');

  window.__powerChart = {series: series, t0: t0, t1: t1, padL: padL, padR: padR,
                         padT: padT, padB: padB, W: W, H: H, Y: Y,
                         fields: lines.map(function (l) {
                           return {index: l[1], label: l[0], color: l[2], decimals: 3, unit: " kWh"};
                         })};

  return '<div class="chart-wrap"><svg id="powerChart" viewBox="0 0 ' + W + ' ' + H +
         '" role="img" aria-label="Power usage over time">' +
         parts.join("") + '</svg><div id="powerTip" class="chart-tip"></div></div>' +
         '<p class="muted">' + legend + ' &middot; kWh-so-today counters, resetting each local midnight.</p>';
}

// Stacked bars, one per completed day, from the "Power usage" sheet (one row
// per midnight rollover) - charge below, inverter above, so bar height is
// that day's total kWh. Same chart as the local dashboard's "Power usage by
// day" card, ported almost verbatim.
function dailyPowerChart(daily) {
  if (!daily || daily.length < 2) return '<p class="muted">Not enough completed days yet - one bar appears each ' +
      'midnight rollover.</p>';

  var W = 800, H = 220, padL = 42, padR = 12, padT = 14, padB = 26;
  var totals = daily.map(function (d) { return (d.charge_kwh || 0) + (d.inverter_kwh || 0); });
  var hi = Math.max.apply(null, totals) * 1.15 || 1;

  var n = daily.length;
  var slot = (W - padL - padR) / n;
  var barW = Math.min(48, slot * 0.62);

  function Y(v) { return padT + (hi - v) / hi * (H - padT - padB); }

  var parts = [];

  var rawStep = hi / 4;
  var mag = Math.pow(10, Math.floor(Math.log(rawStep) / Math.LN10));
  var norm = rawStep / mag;
  var step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  for (var v = 0; v <= hi; v += step) {
    var y = Y(v).toFixed(1);
    parts.push('<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y +
               '" stroke="var(--line)" stroke-width="1" opacity=".6"></line>');
    parts.push('<text x="' + (padL - 6) + '" y="' + (parseFloat(y) + 3.5) +
               '" text-anchor="end" font-size="10" fill="var(--muted)">' + v.toFixed(0) + '</text>');
  }

  var bars = [];
  daily.forEach(function (d, i) {
    var cx = padL + slot * (i + 0.5);
    var x = (cx - barW / 2).toFixed(1);
    var charge = d.charge_kwh || 0, inverter = d.inverter_kwh || 0;
    var yCharge = Y(charge), yTotal = Y(charge + inverter), yZero = Y(0);
    parts.push('<rect x="' + x + '" y="' + yCharge.toFixed(1) +
               '" width="' + barW.toFixed(1) + '" height="' + (yZero - yCharge).toFixed(1) +
               '" fill="var(--ok)"></rect>');
    parts.push('<rect x="' + x + '" y="' + yTotal.toFixed(1) +
               '" width="' + barW.toFixed(1) + '" height="' + (yCharge - yTotal).toFixed(1) +
               '" fill="var(--accent)"></rect>');
    if (n <= 14 || i % Math.ceil(n / 14) === 0) {
      parts.push('<text x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" ' +
                 'fill="var(--muted)">' + esc(d.date.slice(5)) + '</text>');
    }
    bars.push({cx: cx, date: d.date, charge: charge, inverter: inverter});
  });

  window.__dailyPowerChart = {bars: bars, padT: padT, H: H, W: W};

  return '<div class="chart-wrap"><svg id="dailyPowerChart" viewBox="0 0 ' + W + ' ' + H +
         '" role="img" aria-label="Power usage by day">' +
         parts.join("") + '</svg><div id="dailyPowerTip" class="chart-tip"></div></div>' +
         '<p class="muted"><span style="color:var(--ok)">&#9679;</span> charge&nbsp;&nbsp;' +
         '<span style="color:var(--accent)">&#9679;</span> inverter &middot; last ' + daily.length +
         ' completed days.</p>';
}

function bindDailyBarHover(svgId, tipId, chart) {
  var svg = document.getElementById(svgId);
  var tip = document.getElementById(tipId);
  if (!svg || !tip || !chart || !chart.bars.length) return;

  function show(clientX, clientY) {
    var rect = svg.getBoundingClientRect();
    var scale = chart.W / rect.width;
    var x = (clientX - rect.left) * scale;
    var nearest = chart.bars[0];
    chart.bars.forEach(function (b) {
      if (Math.abs(b.cx - x) < Math.abs(nearest.cx - x)) nearest = b;
    });
    tip.innerHTML = '<div class="tip-time">' + esc(nearest.date) + '</div>' +
      '<div><span style="color:var(--ok)">&#9679;</span> charge: ' + nearest.charge.toFixed(2) + ' kWh</div>' +
      '<div><span style="color:var(--accent)">&#9679;</span> inverter: ' + nearest.inverter.toFixed(2) + ' kWh</div>';
    var left = clientX - rect.left + 14;
    if (left + 150 > rect.width) left = clientX - rect.left - 150;
    tip.style.left = Math.max(0, left) + "px";
    tip.style.top = Math.max(0, clientY - rect.top - 12) + "px";
    tip.style.display = "block";
  }
  function hide() { tip.style.display = "none"; }

  svg.addEventListener("mousemove", function (e) { show(e.clientX, e.clientY); });
  svg.addEventListener("mouseleave", hide);
  svg.addEventListener("touchstart", function (e) {
    show(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: true});
  svg.addEventListener("touchmove", function (e) {
    show(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }, {passive: false});
  svg.addEventListener("touchend", hide);
}

function hourSelectHtml() {
  var opts = HOUR_OPTIONS.map(function (o) {
    return '<option value="' + o.hours + '"' + (o.hours === currentHours ? ' selected' : '') +
           '>' + o.label + '</option>';
  }).join("");
  return '<select id="hourSelect">' + opts + '</select>';
}

function daySelectHtml() {
  var opts = DAY_OPTIONS.map(function (o) {
    return '<option value="' + o.days + '"' + (o.days === currentDailyDays ? ' selected' : '') +
           '>' + o.label + '</option>';
  }).join("");
  return '<select id="daySelect">' + opts + '</select>';
}

function render(fields, history, daily, fetchedAt) {
  var cls = statusClass(fields["battery_status"]);
  var volts = fields["battery_volts"];
  var html = "";

  if (fields["battery_status"] === "stale") {
    html += '<div class="card"><div class="banner"><strong>Reading is stale</strong>' +
            '<div class="muted">WattPlot has not updated recently - see "read" time below.</div></div></div>';
  }

  if (fields["active_alerts"] && fields["active_alerts"] !== "none") {
    html += '<div class="card"><h2>Active alerts</h2><div class="alert">' +
            esc(fields["active_alerts"]) + '</div></div>';
  }

  html += '<div class="card"><div class="grid">';
  html += '<div><h2>Battery</h2><div class="volts" style="color:var(--' +
          (cls === "ok" ? "ink" : cls) + ')">' +
          (volts === undefined || volts === "" ? "–" : Number(volts).toFixed(1)) +
          ' <small>V</small></div><div style="margin-top:8px">' +
          '<span class="pill ' + cls + '">' + esc(fields["battery_status"] || "unknown") +
          '</span></div>' +
          '<div class="muted" style="margin-top:8px">MATE ' + esc(fields["mate_status"]) + '</div>' +
          '<div class="muted">today ' +
          (fields["battery_min_today"] !== undefined && fields["battery_min_today"] !== "" ? Number(fields["battery_min_today"]).toFixed(1) : "–") +
          ' / ' +
          (fields["battery_max_today"] !== undefined && fields["battery_max_today"] !== "" ? Number(fields["battery_max_today"]).toFixed(1) : "–") +
          ' V</div></div>';

  [["FX-1", "fx1"], ["FX-2", "fx2"]].forEach(function (pair) {
    var name = pair[0], prefix = pair[1];
    if (!fields[prefix + "_status"]) return;
    html += '<div><h2>' + name + '</h2>' +
            '<div style="font-size:19px;font-weight:600">' + esc(fields[prefix + "_status"]) + '</div>' +
            '<div class="kv"><span class="muted">AC in</span><span>' +
            (fields[prefix + "_ac_in"] !== undefined && fields[prefix + "_ac_in"] !== "" ? Number(fields[prefix + "_ac_in"]).toFixed(0) + " V" : "–") +
            '</span></div>' +
            '<div class="kv"><span class="muted">AC out</span><span>' +
            (fields[prefix + "_ac_out"] !== undefined && fields[prefix + "_ac_out"] !== "" ? Number(fields[prefix + "_ac_out"]).toFixed(0) + " V" : "–") +
            '</span></div>' +
            '<div class="kv"><span class="muted">Inverter / charge kWh</span><span>' +
            (fields[prefix + "_inverter_kwh"] !== undefined && fields[prefix + "_inverter_kwh"] !== "" ? Number(fields[prefix + "_inverter_kwh"]).toFixed(2) : "–") +
            ' / ' +
            (fields[prefix + "_charge_kwh"] !== undefined && fields[prefix + "_charge_kwh"] !== "" ? Number(fields[prefix + "_charge_kwh"]).toFixed(2) : "–") +
            '</span></div></div>';
  });
  html += '</div></div>';

  var voltSeries = history.map(function (r) { return [r[0], Number(r[1])]; })
                          .filter(function (p) { return !isNaN(p[1]); });
  var powerSeries = history.map(function (r) {
    return [r[0], (Number(r[2]) || 0) + (Number(r[4]) || 0), (Number(r[3]) || 0) + (Number(r[5]) || 0)];
  });

  html += '<div class="card"><div class="card-head"><h2>Battery voltage</h2>' + hourSelectHtml() + '</div>' +
          battChart(voltSeries) + '</div>';

  html += '<div class="card"><h2>Power usage</h2>' + powerChart(powerSeries) + '</div>';

  if (daily && daily.length) {
    html += '<div class="card"><div class="card-head"><h2>Power usage by day</h2>' + daySelectHtml() +
            '</div>' + dailyPowerChart(daily) + '</div>';
  }

  html += '<div class="card"><h2>Generator / grid</h2>' +
          '<div class="kv"><span class="muted">Today</span><span>' +
          fmtDuration(fields["generator_today_seconds"]) + '</span></div>' +
          '<div class="kv"><span class="muted">Last 7 days</span><span>' +
          fmtDuration(fields["generator_week_seconds"]) + '</span></div></div>';

  if (fields["recent_error_codes"] && fields["recent_error_codes"] !== "none") {
    html += '<div class="card"><h2>Error codes seen recently</h2>' +
            '<pre class="codes">' + esc(fields["recent_error_codes"]) + '</pre></div>';
  }

  html += '<div class="card"><h2>Reading age</h2>' +
          '<div class="kv"><span class="muted">WattPlot last read</span><span>' +
          fmtStamp(fields["last_reading_at"]) + '</span></div>' +
          '<div class="kv"><span class="muted">Pushed to Google Sheets</span><span>' +
          fmtStamp(fields["timestamp"]) + '</span></div></div>';

  document.getElementById("app").innerHTML = html;
  document.getElementById("updated").textContent =
    "Checked " + fetchedAt.toLocaleTimeString();

  bindChartHover("voltChart", "voltTip", window.__voltChart);
  bindChartHover("powerChart", "powerTip", window.__powerChart);
  bindDailyBarHover("dailyPowerChart", "dailyPowerTip", window.__dailyPowerChart);

  var select = document.getElementById("hourSelect");
  if (select) {
    select.addEventListener("change", function () {
      currentHours = Number(select.value) || 24;
      try { localStorage.setItem("outback_chart_hours", String(currentHours)); } catch (e) {}
      refresh();
    });
  }

  var daySelect = document.getElementById("daySelect");
  if (daySelect) {
    daySelect.addEventListener("change", function () {
      currentDailyDays = Number(daySelect.value) || 30;
      try { localStorage.setItem("outback_daily_days", String(currentDailyDays)); } catch (e) {}
      refresh();
    });
  }
}

function renderError(message) {
  document.getElementById("app").innerHTML =
    '<div class="card"><div class="banner"><strong>Could not load the snapshot</strong>' +
    '<div class="muted">' + esc(message) + '</div></div></div>';
}

function refresh() {
  // The Apps Script Web App this hits typically answers in 2-4 seconds, and
  // sometimes 10+ after it's been idle a while (a Google-side cold start,
  // not something this page can avoid) - so on first load, say so rather
  // than leaving a bare "Loading..." with no sign anything is happening.
  var slowNotice = setTimeout(function () {
    var el = document.getElementById("updated");
    if (el) el.textContent = "Still loading… (first load can take a few seconds)";
  }, 1500);

  var url = WEBAPP_URL + "?key=" + encodeURIComponent(VIEW_KEY) + "&hours=" + currentHours +
            "&daily_days=" + currentDailyDays;
  fetch(url)
    .then(function (r) {
      if (!r.ok) throw new Error("Google Sheets returned HTTP " + r.status);
      return r.json();
    })
    .then(function (body) {
      if (!body.ok) throw new Error(body.error || "no live status yet");
      render(body.fields || {}, body.history || [], body.daily || [], new Date());
    })
    .catch(function (err) {
      renderError(err.message || String(err));
    })
    .then(function () {
      clearTimeout(slowNotice);
    });
}

refresh();
setInterval(refresh, 60000);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) refresh();
});
</script>
</body>
</html>
